  <text x="60" y="709.85" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11" font-weight="600" fill="#d03b3b" text-anchor="start">Two properties this machine exists to guarantee:</text>
  <text x="60" y="731.395" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">releasing the E-stop does not restart motion — recovery needs an explicit CMD_MODE(CLEAR) and then an explicit ARM, and the robot cannot be armed straight out of FAULT.</text>
  <text x="60" y="744.895" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">Both are asserted in the C host tests (19 checks) before any of this runs on hardware. E-stop dominance is physical as well as logical: the contactor removes motor power upstream of the drivers.</text>
  <text x="60" y="791.325" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="9.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.1">SOURCES</text>
