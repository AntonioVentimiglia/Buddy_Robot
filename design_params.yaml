# Buddy design parameters — SINGLE SOURCE OF TRUTH for chosen and assumed values.
#
# Split of responsibilities:
#   docs/requirements/buddy_v0_1_requirements.yaml = what must be true (requirements)
#   this file                                      = what we CHOSE or ASSUME to satisfy them
# No value should live in both.
#
# After editing ANY value here:  python3 tools/build.py
# That regenerates: buddy_params.xacro, docs/analysis/*.md (from marimo notebooks),
# assets/figures/*.svg, robot_ws/analysis/torque_sweep.csv.

chassis:
  # --- INTERFACE: owned HERE, and CAD must satisfy it ---------------------
  # These are not CAD outputs. They are the contract the chassis model has to
  # meet, because they feed the URDF, Gazebo, and the pivot-scrub torque that
  # justified the motor choice. Changing one is a design decision made in this
  # file and pushed OUT to CAD — never the other way round.
  # Full rules: docs/system_model/chassis_interface.md
  length_m: 0.28 # bounding box the model must fit within
  width_m: 0.22
  height_m: 0.10

  # --- MEASURED: owned by CAD, typed back in here ------------------------
  # SolidWorks mass properties is the source. Read them, type them here, re-run
  # `python3 tools/build.py`. That is a measurement, exactly like verifying wheel
  # mass on receipt — the CAD file is never parsed by the build.
  mass_kg: 18.0 # body-only, so gross ~ the 20 kg requirement ceiling
  mass_source: placeholder # placeholder | cad | weighed — provenance, not a value

  # Both null until CAD reports them. null means the URDF falls back to a
  # uniform solid-box approximation about the geometric centre, which is what it
  # has always done; filling them in makes the sim match the real robot.
  com_m: null # {x, y, z} centre of mass relative to base_link origin.
              # THIS is what tips the robot on the 20 deg ramp requirement —
              # the box approximation cannot tell you about it.
  inertia_kgm2: null # {ixx, iyy, izz, ixy, ixz, iyz} about the CoM

wheels: # ADR-0004: goBILDA Hogback 96 mm + 8 mm REX hubs
  part: "goBILDA 3626-0014-0096 Hogback (96 mm, 50A)"
  radius_m: 0.048
  width_m: 0.035 # nominal — verify by measurement on receipt
  mass_kg: 0.2 # nominal — verify by measurement on receipt
  x_offset_m: 0.09 # fore/aft distance from chassis center to axle
  y_offset_m: 0.13 # lateral distance from center (track/2)
  z_offset_m: -0.04 # axle relative to base_link center; base_center_z is DERIVED
                    # as radius_m - z_offset_m so wheels always touch ground in sim

drive_motor: # ADR-0003: goBILDA 5203 Yellow Jacket 26.9:1
  # All figures below are DATASHEET VALUES AT 12 V. The bus is now 4S LiFePO4
  # (10.0-14.6 V, 12.8 V nominal), so the motors run slightly ABOVE nominal:
  #   - speed and stall torque scale with voltage: 223 RPM -> ~238 at 12.8 V,
  #     ~271 at 14.6 V. That is spare headroom, not a problem — required wheel
  #     RPM is derived from the speed requirements (buddy_calcs/drive.py), never
  #     from this number.
  #   - stall CURRENT scales too: 9.2 A -> ~11.2 A at 14.6 V. This only moves the
  #     "unlimited stall" FAULT scenario; every operating case is capped by
  #     driver_current_limit_a below, and torque per amp (Kt) is voltage
  #     independent, so the pivot-torque check is unaffected.
  part: "goBILDA 5203-2402-0027 (26.9:1, 223 RPM @ 12 V)"
  count: 4
  stall_torque_nm: 3.73
  stall_current_a: 9.2
  no_load_rpm: 223
  # Datasheet (5203-2402-0027_spec_sheet.pdf): "Encoder Shaft: 28 Pulses per
  # Rotation (7 Cycles)" -> 28/7 = 4 pulses per quadrature cycle, i.e. goBILDA's
  # "pulses" ARE already 4x-decoded counts. Output = 28 x 26.9 = 753.2.
  # Do NOT multiply by 4 again (that bug shipped once; the name now says counts).
  # NOTE: the datasheet's companion "(134.4 Cycles)" line is a vendor error -
  # 134.4 = 7 x 19.2 belongs to the 19.2:1 motor.
  #
  # VERIFIED ON HARDWARE 2026-08-02 (devops/jetson/verify_encoder_counts.py):
  # 5 hand turns of a wheel-mounted LF motor gave 3753 counts = 750.6 /rev,
  # -0.3% from 753.2. That residual is ~1.2 deg of pen-mark alignment per turn,
  # i.e. measurement error, not disagreement. The 4x reading (3013) that the
  # datasheet ambiguity allowed did NOT occur: goBILDA's "28 pulses" really are
  # already 4x-decoded counts. This number is now measured, not inferred.
  encoder_counts_per_rev_output: 753.2

  # Per-wheel encoder sign, order LF, LR, RF, RR. Applied in firmware so that
  # telemetry wheel_pos ALWAYS means "positive = the direction that drives the
  # robot forward", making the protocol contract unambiguous for every consumer.
  #
  # This is a mounting consequence, not a wiring mistake. On a skid-steer the
  # left and right motors are mirrored, so when the robot drives forward the two
  # sides' shafts turn opposite ways relative to their own housings — one side
  # must be negated no matter how neatly it is wired.
  #
  # The 2026-08-02 bench test read NEGATIVE for a motor turned in the judged
  # "forward" direction, but that motor was unmounted, so which side needs the
  # negation is not yet knowable. FINALISE AT ASSEMBLY, once chassis CAD fixes
  # motor orientation: drive each wheel forward, and flip any channel that
  # counts down. Do NOT "fix" this by swapping A/B at the connector — that hides
  # the convention in the harness where the next person cannot see it.
  encoder_sign: [1, 1, 1, 1] # provisional — see above
  encoder_sign_source: provisional # provisional | assembly-verified
  price_usd: 54.99

power: # ADR-0005: 4S LiFePO4 + BMS architecture; see docs/analysis/power_budget_and_battery.py
  bus:
    # CHEMISTRY CHANGED 2026-08-01 (ADR-0005 amendment #2): 3S Li-ion -> 4S
    # LiFePO4. Two sourcing realities drove it, not a preference:
    #   1. A 3S Li-ion pack with a >=50 A continuous BMS is not a consumer
    #      product; stock packs ship 10-30 A boards and would nuisance-trip on
    #      the first carpet pivot (designed peak is ~46 A).
    #   2. The Jetson rail could not be built. A 3S bus is 12.6 V only at full
    #      charge and bottoms at 9.0 V, so a "12 V buck" cannot regulate from it,
    #      and the dev kit's 9-20 V window had ZERO margin at the bottom.
    # LiFePO4's 10.0-14.6 V sits inside 9-20 V with margin at both ends, so the
    # Jetson feeds straight off the bus and the converter disappears entirely.
    chemistry: "4S LiFePO4 with BMS"
    v_nominal: 12.8
    v_full: 14.6
    v_cutoff: 10.0
  driver_current_limit_a: 8.0 # per-motor cap set in the motor driver — turns the
                              # stall fault into a designed ceiling (drivers must
                              # support an adjustable limit; selection pending)
  motor_no_load_current_a: 0.25 # CONFIRMED by datasheet (No-Load Current @ 12VDC)
  # Allocations, not measurements. Unchosen hardware gets a RESERVE that becomes
  # a hard selection constraint: a candidate exceeding its reserve triggers a
  # budget re-run before purchase.
  loads_w:
    jetson_orin_nano: 30 # 25 W super mode + carrier board overhead
    rgbd_camera_reserve: 5 # covers RealSense D435 (~2 W) up to OAK-D class (~5 W)
    lidar_2d_reserve: 5 # covers LD19 (~1.5 W) up to RPLIDAR S-class (~4 W)
    mcu_drivers_logic: 5 # NUCLEO-G474 + driver logic + encoders + E-stop circuit
    expansion_reserve: 10 # fans, LEDs, future additions — unallocated headroom
  duty_cycle: # normal-duty mission model for the 60 min runtime requirement
    moving_fraction: 0.7 # fraction of mission spent driving
    maneuver_power_factor: 1.5 # average driving power vs flat cruise (turns, accels)
    jetson_average_w: 20 # typical between 15 W mode and 25 W super bursts
  battery_sizing:
    usable_fraction: 0.80 # depth-of-discharge for cycle life. Conservative for
                          # LiFePO4, which tolerates deeper cycling than Li-ion —
                          # left at 0.80 so the capacity target keeps its margin.
    conversion_efficiency: 0.90 # DC-DC losses on regulated rails
    drive_electrical_efficiency: 0.60 # motor + driver, mech power -> battery power
  future_arms: # dual 6-DOF arms planned for a later version (requirements yaml:
               # manipulation_future). Not built in v0.1, but the battery bought
               # now must carry them.
               #
               # ACTUATOR CLASS CHANGED 2026-07-31 (ADR-0009): printed structure
               # + hobby servos, NOT the XM430-class smart servos these numbers
               # were originally estimated from. The values below are UNCHANGED
               # pending servo selection because the bounding analysis in
               # ADR-0009 showed avg_power_w still holds (~39 W estimated) and
               # peak_current_a is marginal (~11 A estimated for 8 loaded
               # joints). The all-stalled case (~29 A) is contained by
               # protection.arm_branch_fuse_a below — which is therefore now the
               # PRIMARY current limiter for the arm branch, not a backstop:
               # hobby servos have no programmable current limit, so ADR-0005's
               # "stall is a designed ceiling" reasoning does not apply here.
               # Refine with measured servo specs at selection, then re-run the
               # build so the validator re-checks the chain.
    joint_count: 12
    avg_power_w: 45 # both arms, manipulation duty (<=4 joints loaded per arm at once)
    peak_current_a: 10 # both arms aggressive simultaneous lift, transient
  protection:
    bms_min_continuous_a: 50 # must exceed designed peak INCLUDING future arm
                             # branch (46.3 A on the 12.8 V LiFePO4 bus; was
                             # 47.0 A at 11.1 V — higher volts, less current)
    main_fuse_a: 60 # slow-blow; bus wiring 8 AWG (or 2x10 AWG) to stay above fuse
    arm_branch_fuse_a: 15 # future arm branch gets its own fuse off the bus

mass_budget:
  # Measured component masses, rolled up and checked against the requirement
  # ceiling (requirements yaml: mass.design_gross_mass_limit_kg = 20 kg).
  #
  # WHY THIS EXISTS: chassis.mass_kg above was reverse-engineered so that gross
  # landed near the 20 kg limit — its own comment admitted it. That made the
  # ceiling an assumption rather than a check. With real numbers here, structure
  # mass comes from CAD and GROSS BECOMES DERIVED, so every build re-checks it.
  # It matters now: LiFePO4 cost ~+1.3 kg (ADR-0005 amendment 2), and printed
  # structure is heavier than machined for the same stiffness (ADR-0008).
  #
  # HOW TO FILL: weigh each part type once, enter the PER-UNIT mass in kg.
  # Identical parts share one value and a count — see spread_g below.
  #
  # DOUBLE COUNTING is the classic mass-budget error. Each screw, cable and
  # connector belongs to exactly ONE line. The convention here: a component's
  # mass is the part AS SUPPLIED (motor includes its moulded-on leads); anything
  # you add during assembly goes in a fasteners/harness line.
  #
  # NOT LISTED HERE: wheels. Their mass already lives in wheels.mass_kg because
  # the URDF consumes it for wheel-link inertia. The rollup reads it from there.
  # No value may exist in two places.

  scale_resolution_g: 1 # smallest division your scale reads. Needed to make
                           # "all four measured the same" an honest statement
                           # rather than a rounding artefact.

  components:
    drive_motor:
      each_kg: 0.433 # goBILDA 5203, AS SUPPLIED incl. 470 mm power leads + encoder pigtail
      count: 4
      source: weighed # datasheet | measured | weighed
      spread_g: 0 # (heaviest - lightest) across the units. null = not checked.
                     # Only split into per-unit values if this is large enough to
                     # matter to something that actually consumes asymmetry.
    wheel_hub:
      each_kg: 0.014 # goBILDA Sonic hub, 8 mm REX w/ two (provided) M4 screws
      count: 4
      source: weighed
      spread_g: null
    drivetrain_fasteners:
      each_kg: null # M4 screws + any hardware added at assembly, per drivetrain corner
      count: 4
      source: null
      spread_g: null
    harness_drivetrain:
      each_kg: 0.022 # encoder breakout + motor power cabling, per motor
      count: 4
      source: weighed
      spread_g: null

  # Bought but not yet in hand — fill when they arrive.
  pending:
    battery_kg: null # 12 V 20 Ah LiFePO4, ~2.1 kg expected (ADR-0005 amendment 2)
    jetson_kg: 0.173 # Orin Nano dev kit incl. heatsink/fan
    drive_mcu_kg: 0.038 # NUCLEO-G474RE
    motor_drivers_kg: 0.011 # 4x VNH5019 carriers, total
    protection_kg: null # fuse holder, contactor, E-stop, bus wiring

firmware: # drive MCU runtime constants; tools/build.py generates
          # firmware/drive_mcu/include/buddy_config.h from this section
          # (velocity limit and current limit are pulled from requirements/power)
  watchdog_ms: 200 # REQ_SAFE_002 initial placeholder
  telemetry_hz: 100
  control_hz: 1000
  pwm_hz: 20000 # VNH5019 max, ultrasonic

assumptions: # estimates to be replaced by measurement — see analysis docs' limits sections
  crr_carpet: 0.05 # rolling resistance, high end of published carpet range
  drivetrain_efficiency: 0.75 # conservative: planetary gearbox + hub coupling
  safety_factor: 2.0 # applied to torque DEMAND (never to motor capability)
  accel_design_mps2: 0.5 # commanded forward acceleration, design case
  scrub_mu: # lateral tire scrub friction for pivot-in-place
    marble: 0.4
    carpet_low: 0.6
    carpet_high: 0.8
