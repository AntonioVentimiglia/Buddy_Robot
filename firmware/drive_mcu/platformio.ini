; Buddy drive MCU — NUCLEO-G474RE (ADR selections: STM32G474 + VNH5019 + VCP link)
; Build:  pio run          Flash:  pio run -t upload
; Host tests (no hardware): ../../tools/run_protocol_tests.sh
[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
build_flags =
    -Wall -Wextra
    -I include
; shared protocol library (single source of truth, also used by host tests)
lib_extra_dirs = ../shared_protocol
monitor_speed = 921600
