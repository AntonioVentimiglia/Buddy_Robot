  <text x="454" y="261.43" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="start">Sized against the 46 A designed peak including the future arm branch — not against the 37 A unlimited-stall fault, which the driver current limit makes unreachable.</text>
  <text x="454" y="274.93" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="start">Stall current is a fault condition, not an operating point. See power_budget.svg and ADR-0005.</text>
  <rect x="430" y="486" width="300" height="92" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="431.5" y="487.5" width="3" height="89" rx="1.5" fill="#1baf7a"/>
  <text x="582" y="523.775" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">12 V buck</text>
  <text x="582" y="537.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">≥ 5 A regulated</text>
  <text x="582" y="549.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">isolates compute from motor sag</text>
  <rect x="790" y="486" width="510" height="92" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="791.5" y="487.5" width="3" height="89" rx="1.5" fill="#1baf7a"/>
  <text x="1047" y="517.675" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Jetson Orin Nano Super</text>
  <text x="1047" y="531.225" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">30 W allocation · 20 W typical</text>
  <text x="1047" y="543.58" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">dev-kit input 9–20 V, so even the raw bus is in-window</text>
  <text x="1047" y="555.78" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">also supplies the LD19 over USB (5 W reserve, 0.9 W actual)</text>
  <rect x="430" y="598" width="300" height="124" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="431.5" y="599.5" width="3" height="121" rx="1.5" fill="#1baf7a"/>
  <text x="582" y="651.775" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">5 V buck</text>
  <text x="582" y="665.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">≥ 3 A</text>
  <text x="582" y="677.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">logic rail</text>
  <rect x="790" y="598" width="510" height="124" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="791.5" y="599.5" width="3" height="121" rx="1.5" fill="#1baf7a"/>
  <text x="1047" y="639.575" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">NUCLEO-G474RE via E5V (JP3 = E5V)</text>
  <text x="1047" y="653.125" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">5 W allocation for MCU + driver logic + encoders</text>
  <text x="1047" y="665.48" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">the MCU stays alive through a Jetson reboot — USB stays data-only</text>
  <text x="1047" y="677.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">+3V3 from the Nucleo LDO feeds encoders ×4, VNH5019 logic, BNO086</text>
  <text x="1047" y="689.88" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">3.3 V everywhere means no level shifters anywhere in the robot</text>
  <rect x="430" y="742" width="300" height="92" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="431.5" y="743.5" width="3" height="89" rx="1.5" fill="#1baf7a"/>
  <text x="582" y="779.775" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">no converter</text>
  <text x="582" y="793.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">raw, unregulated bus</text>
  <text x="582" y="805.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">9.0–12.6 V straight to the drivers</text>
  <rect x="790" y="742" width="510" height="92" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="791.5" y="743.5" width="3" height="89" rx="1.5" fill="#1baf7a"/>
  <text x="1047" y="773.675" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">VNH5019 ×4 → goBILDA 5203 ×4</text>
  <text x="1047" y="787.225" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">8 A per motor firmware limit (device rating 12 A continuous / 30 A peak)</text>
  <text x="1047" y="799.58" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">VNH5019 operating range 5.5–24 V covers the whole discharge curve</text>
  <text x="1047" y="811.78" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">motor return GND_PWR stars at the battery, never through the logic ground</text>
  <rect x="430" y="854" width="300" height="92" rx="5" fill="#fcfcfb" stroke="#898781" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="431.5" y="855.5" width="3" height="89" rx="1.5" fill="#4a3aa7" opacity="0.45"/>
  <text x="582" y="891.775" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">branch fuse</text>
  <text x="582" y="905.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">15 A</text>
  <text x="582" y="917.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">own protection</text>
  <rect x="790" y="854" width="510" height="92" rx="5" fill="#fcfcfb" stroke="#898781" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="791.5" y="855.5" width="3" height="89" rx="1.5" fill="#4a3aa7" opacity="0.45"/>
  <text x="1047" y="891.775" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">dual 6-DOF arms — a later version</text>
  <text x="1047" y="905.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">+45 W average, +10 A peak (XM430-class placeholder)</text>
  <text x="1047" y="917.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">the battery and bus are bought now at this size so the arms cost no rework</text>
  <text x="48" y="975.85" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11" font-weight="600" fill="#d03b3b" text-anchor="start">The one rule this diagram exists to make unmissable:</text>
  <text x="48" y="997.43" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="start">motor power reaches the MOTORS through the DRIVERS and never touches the microcontroller. The Nucleo only ever sees logic signals to the driver and four low-current encoder wires.</text>
  <text x="48" y="1010.93" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="start">Everything on the +12V_BUS is downstream of the E-stop contactor, so the E-stop removes motion whatever the firmware is doing — the ESTOP_STATE pin is reporting only.</text>
  <text x="48" y="1039.33" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="9.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.1">SOURCES</text>
  <text x="112" y="1039.39" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">ADR-0005 (power architecture) · power_budget_and_battery.md · wiring_harness.md · electrical_interfaces.md</text>
</svg>
