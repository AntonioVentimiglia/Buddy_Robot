  <rect x="118" y="104" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="105.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="129.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Linux boots</text>
  <text x="620" y="143.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">Jetson · Linux</text>
  <rect x="118" y="170" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="171.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="195.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">systemd starts safe bringup</text>
  <text x="620" y="209.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">Jetson · Linux</text>
  <rect x="118" y="236" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="237.5" width="3" height="53" rx="1.5" fill="#1baf7a"/>
  <text x="620" y="255.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">MCU boots → SELF_TEST → SAFE_IDLE</text>
  <text x="620" y="269.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">drive MCU</text>
  <text x="620" y="281.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">gate: motors off</text>
  <rect x="118" y="302" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="303.5" width="3" height="53" rx="1.5" fill="#1baf7a"/>
  <text x="620" y="321.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">bridge opens the serial port</text>
  <text x="620" y="335.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">buddy_base</text>
  <text x="620" y="347.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">gate: PING/PONG version match</text>
  <rect x="118" y="368" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="369.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="393.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">robot_state_publisher → /tf_static</text>
  <text x="620" y="407.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">robot_state_publisher</text>
  <rect x="118" y="434" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="435.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="459.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">LiDAR + IMU drivers start</text>
  <text x="620" y="473.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">sensor drivers</text>
  <rect x="118" y="500" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="501.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="525.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">diagnostics aggregator starts</text>
  <text x="620" y="539.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">diagnostics</text>
  <rect x="118" y="566" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="567.5" width="3" height="53" rx="1.5" fill="#1baf7a"/>
  <text x="620" y="585.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">localization / SLAM starts</text>
  <text x="620" y="599.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">localization</text>
  <text x="620" y="611.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">gate: transforms valid</text>
  <rect x="118" y="632" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="633.5" width="3" height="53" rx="1.5" fill="#2a78d6"/>
  <text x="620" y="657.525" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Nav2 lifecycle configure+activate</text>
  <text x="620" y="671.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">Nav2</text>
  <rect x="118" y="698" width="1000" height="56" rx="5" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2"/>
  <rect x="119.5" y="699.5" width="3" height="53" rx="1.5" fill="#d03b3b"/>
  <text x="620" y="717.425" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">operator arms the robot</text>
  <text x="620" y="731.325" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="middle">operator</text>
  <text x="620" y="743.68" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.8" font-weight="400" fill="#898781" text-anchor="middle">gate: E-stop clear · battery healthy · transforms valid · sensors live</text>
  <text x="118" y="801.85" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="11" font-weight="600" fill="#d03b3b" text-anchor="start">The rule this ordering exists to enforce:</text>
  <text x="118" y="823.465" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.9" font-weight="400" fill="#898781" text-anchor="start">After a reboot or an OTA update Buddy boots into SAFE_IDLE, never into armed motion. Motion requires an explicit ARM</text>
  <text x="118" y="838.465" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.9" font-weight="400" fill="#898781" text-anchor="start">from the operator.</text>
  <text x="118" y="875.395" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">Step 3 is the one that makes the rest safe: the MCU reaches SAFE_IDLE on its own power, before the Jetson has finished booting and whether or not ROS 2 ever starts. Powering the Nucleo</text>
  <text x="118" y="888.895" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">from the 5 V rail through E5V rather than from Jetson USB is what makes that true — the MCU survives a Jetson reboot, and a Jetson that never comes back simply leaves the wheels stopped.</text>
  <text x="118" y="931.325" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="9.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.1">SOURCES</text>
  <text x="182" y="931.395" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="9.7" font-weight="400" fill="#898781" text-anchor="start">startup_sequence.md · fault_state_machine.svg · devops/systemd · ADR-0006</text>
</svg>
