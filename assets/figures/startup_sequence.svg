  <text x="28" y="50.78" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="10.8" font-weight="400" fill="#898781" text-anchor="start">From docs/system_model/integration_map.yaml · red rows carry a gate condition · nothing on this page can move the robot until the last one</text>
